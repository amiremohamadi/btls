name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./scripts/requirements.txt
          rustup target add x86_64-unknown-linux-musl
          cd vscode && npm ci

      - name: build server
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: bundle extension
        run: npx webpack
        working-directory: vscode

      - name: copy server binary
        run: cp target/x86_64-unknown-linux-musl/release/btls vscode/dist/

      - name: package vsix
        run: npx vsce package --allow-missing-repository
        working-directory: vscode

      - uses: actions/upload-artifact@v4
        with:
          name: btls-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/btls

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-bpftrace-vsix-linux-x64
          path: vscode/*.vsix

  upload-release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: btls-*
          path: ${{ github.workspace }}/artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: vscode-bpftrace-vsix-*
          path: ${{ github.workspace }}/artifacts
          merge-multiple: true

      - name: rename binary
        run: |
          version=$(jq -r .version vscode/package.json)
          cd artifacts
          mv btls-x86_64-unknown-linux-musl/btls "btls-${version}-linux-x86_64"
          rmdir btls-x86_64-unknown-linux-musl
        shell: bash

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
